name: Galaxy A31 - LineageOS 19.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ROM_DIR: ${{ github.workspace }}/rom
      CCACHE_DIR: ${{ github.workspace }}/ccache
      RELEASE_DIR: ${{ github.workspace }}/release

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Disk check - checkout
        run: |
          echo "===== DISK ====="
          df -h

      # ============================================================
      # 2. FREE RUNNER SPACE
      # ============================================================
      - name: Free runner disk space
        run: |
          echo "===== CLEANING RUNNER ====="

          sudo rm -rf /usr/local/lib/android || true
          df -h

          sudo rm -rf /usr/share/dotnet || true
          df -h

          sudo rm -rf /opt/ghc || true
          df -h

          sudo rm -rf /opt/hostedtoolcache || true
          df -h

          sudo rm -rf /usr/local/share/powershell || true
          df -h

          sudo rm -rf /usr/local/share/chromium || true
          df -h

          sudo rm -rf /usr/local/lib/node_modules || true
          df -h

          sudo docker system prune -af || true
          df -h

          sudo apt-get clean || true
          df -h

      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libssl-dev \
            libxml2-utils \
            lzop \
            openjdk-11-jdk \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

          df -h

      # ============================================================
      # 4. REPO
      # ============================================================
      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

          df -h

      # ============================================================
      # 5. INIT LINEAGEOS 19.1
      # ============================================================
      - name: Initialize LineageOS 19.1
        run: |
          mkdir -p "$ROM_DIR"

          cd "$ROM_DIR"

          repo init \
            -u https://github.com/LineageOS/android.git \
            -b lineage-19.1 \
            --git-lfs

          df -h

      # ============================================================
      # 6. SYNC LINEAGEOS 19.1
      # ============================================================
      - name: Sync LineageOS 19.1
        working-directory: ${{ env.ROM_DIR }}
        run: |
          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2

          df -h

      # ============================================================
      # 7. A31 DEVICE TREE
      # ============================================================
      - name: Clone A31 device tree
        working-directory: ${{ env.ROM_DIR }}
        run: |
          rm -rf device/samsung/a31

          git clone \
            --depth=1 \
            -b lineage-20 \
            https://github.com/Galaxy-MT6768/android_device_samsung_a31x.git \
            device/samsung/a31

          echo "===== DEVICE TREE ====="
          ls -la device/samsung/a31

          df -h

      # ============================================================
      # 8. MT6768 COMMON
      # ============================================================
      - name: Clone MT6768 common tree
        working-directory: ${{ env.ROM_DIR }}
        run: |
          rm -rf device/samsung/mt6768-common

          git clone \
            --depth=1 \
            -b lineage-20 \
            https://github.com/Galaxy-MT6768/android_device_samsung_mt6768-common.git \
            device/samsung/mt6768-common

          echo "===== COMMON TREE ====="
          ls -la device/samsung/mt6768-common

          df -h

      # ============================================================
      # 9. KERNEL
      # ============================================================
      - name: Clone MT6768 kernel
        working-directory: ${{ env.ROM_DIR }}
        run: |
          rm -rf kernel/samsung/mt6768

          git clone \
            --depth=1 \
            -b lineage-19.1 \
            https://github.com/Galaxy-MT6768/android_kernel_samsung_mt6768.git \
            kernel/samsung/mt6768

          echo "===== KERNEL ====="
          ls -la kernel/samsung/mt6768

          df -h

      # ============================================================
      # 10. CHECK DEFCONFIG
      # ============================================================
      - name: Check kernel defconfig
        working-directory: ${{ env.ROM_DIR }}
        run: |
          echo "===== KERNEL DEFCONFIGS ====="

          find kernel/samsung/mt6768/arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            | sort \
            | grep -Ei 'a31|a31x|mt6768' || true

          df -h

      # ============================================================
      # 11. CHECK BOARD CONFIG
      # ============================================================
      - name: Check BoardConfig
        working-directory: ${{ env.ROM_DIR }}
        run: |
          echo "===== BOARD CONFIG ====="

          sed -n '1,320p' \
            device/samsung/a31/BoardConfig.mk || true

          df -h

      # ============================================================
      # 12. CHECK VENDOR
      # ============================================================
      - name: Check vendor
        working-directory: ${{ env.ROM_DIR }}
        run: |
          echo "===== VENDOR ====="

          if [ -d "vendor/samsung/a31" ]; then
            echo "vendor/samsung/a31 FOUND"
            du -sh vendor/samsung/a31
          else
            echo "WARNING:"
            echo "vendor/samsung/a31 NOT FOUND"
            echo
            echo "The ROM build needs the A31 proprietary/vendor files."
          fi

          df -h

      # ============================================================
      # 13. CCACHE
      # ============================================================
      - name: Configure ccache
        run: |
          mkdir -p "$CCACHE_DIR"

          ccache -M 10G

          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_EXEC=$(command -v ccache)" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"

          ccache -s

          df -h

      # ============================================================
      # 14. JAVA 11
      # ============================================================
      - name: Configure Java 11
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64" \
            >> "$GITHUB_ENV"

          echo "/usr/lib/jvm/java-11-openjdk-amd64/bin" \
            >> "$GITHUB_PATH"

          java -version

          df -h

      # ============================================================
      # 15. BUILD ENVIRONMENT
      # ============================================================
      - name: Setup build environment
        working-directory: ${{ env.ROM_DIR }}
        run: |
          source build/envsetup.sh

          lunch lineage_a31-userdebug

          echo "===== BUILD TARGET ====="
          echo "$TARGET_PRODUCT"
          echo "$TARGET_DEVICE"
          echo "$TARGET_BUILD_VARIANT"

          df -h

      # ============================================================
      # 16. VERIFY PRODUCT
      # ============================================================
      - name: Verify product configuration
        working-directory: ${{ env.ROM_DIR }}
        run: |
          source build/envsetup.sh

          lunch lineage_a31-userdebug

          get_build_var TARGET_PRODUCT
          get_build_var TARGET_DEVICE
          get_build_var TARGET_BUILD_VARIANT

          df -h

      # ============================================================
      # 17. BUILD KERNEL / BOOT
      # ============================================================
      - name: Build boot image
        working-directory: ${{ env.ROM_DIR }}
        run: |
          source build/envsetup.sh

          lunch lineage_a31-userdebug

          mka bootimage -j2

          echo "===== BOOT IMAGE ====="

          ls -lh \
            out/target/product/a31/boot.img

          df -h

      # ============================================================
      # 18. BUILD FULL ROM
      # ============================================================
      - name: Build LineageOS 19.1
        working-directory: ${{ env.ROM_DIR }}
        run: |
          source build/envsetup.sh

          lunch lineage_a31-userdebug

          echo "========================================"
          echo " LINEAGEOS 19.1 BUILD"
          echo " ANDROID 12L"
          echo " GALAXY A31"
          echo "========================================"

          mka bacon -j2

          df -h

      # ============================================================
      # 19. FIND ROM ZIP
      # ============================================================
      - name: Find flashable ROM
        working-directory: ${{ env.ROM_DIR }}
        run: |
          mkdir -p "$RELEASE_DIR"

          echo "===== BUILD OUTPUT ====="

          ls -lah out/target/product/a31/

          echo
          echo "===== ZIP FILES ====="

          find out/target/product/a31 \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            -printf "%f\n" \
            | sort

          ROM_ZIP="$(find out/target/product/a31 \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            | head -1)"

          if [ -z "$ROM_ZIP" ]; then
            echo "ERROR: No ROM ZIP found."
            exit 1
          fi

          echo
          echo "FOUND ROM:"
          echo "$ROM_ZIP"

          cp -v "$ROM_ZIP" "$RELEASE_DIR/"

          df -h

      # ============================================================
      # 20. TEST ZIP
      # ============================================================
      - name: Test ROM ZIP
        run: |
          ZIP_FILE="$(find "$RELEASE_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            | head -1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ROM ZIP missing."
            exit 1
          fi

          echo "===== ROM ====="
          ls -lh "$ZIP_FILE"

          echo
          echo "===== ZIP TEST ====="

          unzip -t "$ZIP_FILE"

          echo
          echo "===== ZIP CONTENT ====="

          unzip -l "$ZIP_FILE" | head -100

          df -h

      # ============================================================
      # 21. UPLOAD FLASHABLE ZIP
      # ============================================================
      - name: Upload flashable ROM
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-A31-LineageOS-19.1-FLASHABLE
          path: release/*.zip
          if-no-files-found: error
          compression-level: 0

      # ============================================================
      # 22. UPLOAD BUILD LOGS
      # ============================================================
      - name: Upload build information
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-A31-LineageOS-19.1-logs
          path: |
            rom/out/soong.log
            rom/out/target/product/a31/*.txt
          if-no-files-found: ignore

      # ============================================================
      # 23. FINAL DISK CHECK
      # ============================================================
      - name: Final disk report
        if: always()
        run: |
          echo "========================================"
          echo " FINAL DISK STATUS"
          echo "========================================"

          df -h

          echo
          echo "===== OUT ====="
          du -sh "$ROM_DIR/out" 2>/dev/null || true

          echo
          echo "===== CCACHE ====="
          du -sh "$CCACHE_DIR" 2>/dev/null || true

          echo
          echo "===== RELEASE ====="
          du -sh "$RELEASE_DIR" 2>/dev/null || true

          echo
          echo "===== RELEASE FILES ====="
          ls -lh "$RELEASE_DIR" 2>/dev/null || true
