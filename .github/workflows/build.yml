name: Build LineageOS 19.1 - Galaxy A31

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v6

      # ============================================================
      # FREE DISK SPACE
      # ============================================================
      - name: Free disk space
        run: |
          set -ex

          echo "=== Disk before cleanup ==="
          df -h

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache

          sudo apt-get clean

          echo "=== Disk after cleanup ==="
          df -h

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        run: |
          set -ex

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libncurses6 \
            libssl-dev \
            libxml2-utils \
            lzop \
            openjdk-11-jdk \
            pngcrush \
            python3 \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

          java -version
          python3 --version
          git --version

      # ============================================================
      # INSTALL REPO
      # ============================================================
      - name: Install repo tool
        run: |
          set -ex

          mkdir -p "${HOME}/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"

          chmod +x "${HOME}/bin/repo"

          echo "${HOME}/bin" >> "${GITHUB_PATH}"

          "${HOME}/bin/repo" --version

      # ============================================================
      # INITIALIZE LINEAGEOS 19.1
      # ============================================================
      - name: Initialize LineageOS 19.1
        run: |
          set -ex

          mkdir -p "${GITHUB_WORKSPACE}/lineage"
          cd "${GITHUB_WORKSPACE}/lineage"

          "${HOME}/bin/repo" init \
            -u https://github.com/LineageOS/android.git \
            -b lineage-19.1 \
            --depth=1 \
            --no-repo-verify

      # ============================================================
      # SYNC SOURCE
      # ============================================================
      - name: Sync LineageOS source
        run: |
          set -ex

          cd "${GITHUB_WORKSPACE}/lineage"

          "${HOME}/bin/repo" sync \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            --current-branch \
            --detach \
            -j1

          echo "=== Source sync complete ==="
          df -h

      # ============================================================
      # A31 DEVICE TREE
      # ============================================================
      - name: Clone A31 device tree
        run: |
          set -ex

          cd "${GITHUB_WORKSPACE}/lineage"

          git clone \
            --depth=1 \
            --branch main \
            https://github.com/KernelMasterX/android_device_samsung_a31.git \
            device/samsung/a31

      # ============================================================
      # A31 KERNEL
      # ============================================================
      - name: Clone A31 kernel
        run: |
          set -ex

          cd "${GITHUB_WORKSPACE}/lineage"

          git clone \
            --depth=1 \
            --branch lineage-19.1 \
            https://github.com/KernelMasterX/android_kernel_samsung_a31.git \
            kernel/samsung/a31

      # ============================================================
      # A31 VENDOR
      # ============================================================
      - name: Clone A31 vendor
        run: |
          set -ex

          cd "${GITHUB_WORKSPACE}/lineage"

          git clone \
            --depth=1 \
            --branch lineage-19.1 \
            https://github.com/KernelMasterX/android_vendor_samsung_a31.git \
            vendor/samsung/a31

      # ============================================================
      # VERIFY SOURCES
      # ============================================================
      - name: Verify A31 sources
        run: |
          set -ex

          cd "${GITHUB_WORKSPACE}/lineage"

          echo "=== Device tree ==="

          test -f device/samsung/a31/AndroidProducts.mk
          test -f device/samsung/a31/BoardConfig.mk
          test -f device/samsung/a31/device.mk
          test -f device/samsung/a31/a31.mk

          echo "=== Kernel ==="

          test -f kernel/samsung/a31/Makefile

          echo "=== Vendor ==="

          test -d vendor/samsung/a31

          echo "=== AndroidProducts.mk ==="
          cat device/samsung/a31/AndroidProducts.mk

          echo "=== a31.mk ==="
          cat device/samsung/a31/a31.mk

          echo "=== Sources verified ==="

          df -h

      # ============================================================
      # CCACHE
      # ============================================================
      - name: Configure ccache
        run: |
          set -ex

          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          ccache -M 20G

          ccache -z
          ccache -s

      # ============================================================
      # PREPARE BUILD ENVIRONMENT
      #
      # IMPORTANT:
      # NO set -u
      # ============================================================
      - name: Prepare build environment
        shell: bash
        run: |
          set -ex

          cd "${GITHUB_WORKSPACE}/lineage"

          echo "=== Checking build system ==="

          test -f build/envsetup.sh
          test -f build/make/core/envsetup.mk

          echo "=== Source envsetup ==="

          source build/envsetup.sh

          echo "=== Lunch A31 ==="

          lunch a31-userdebug

          echo "=== Product information ==="

          get_build_var TARGET_PRODUCT
          get_build_var TARGET_DEVICE
          get_build_var TARGET_BUILD_VARIANT

          echo "=== Build environment ready ==="

          df -h

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build LineageOS 19.1
        shell: bash
        run: |
          set -ex

          cd "${GITHUB_WORKSPACE}/lineage"

          source build/envsetup.sh

          lunch a31-userdebug

          echo "=== Disk before build ==="
          df -h

          echo "=== Starting mka bacon ==="

          mka bacon

          echo "=== BUILD FINISHED ==="

          echo "=== Disk after build ==="
          df -h

          echo "=== Ccache ==="
          ccache -s

      # ============================================================
      # INSPECT OUTPUT
      # ============================================================
      - name: Inspect build output
        if: success()
        run: |
          set -ex

          cd "${GITHUB_WORKSPACE}/lineage"

          echo "=== A31 output ==="

          du -sh out || true

          ls -lah out/target/product/a31 || true

          echo "=== ROM ZIP ==="

          find out/target/product/a31 \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            -exec ls -lh {} \; || true

          echo "=== Images ==="

          find out/target/product/a31 \
            -maxdepth 1 \
            -type f \
            -name "*.img" \
            -exec ls -lh {} \; || true

          df -h

      # ============================================================
      # VALIDATE ROM
      # ============================================================
      - name: Validate ROM package
        if: success()
        run: |
          set -ex

          cd "${GITHUB_WORKSPACE}/lineage"

          ROM_ZIP=$(find out/target/product/a31 \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            | head -n 1)

          test -n "${ROM_ZIP}"

          echo "ROM:"
          echo "${ROM_ZIP}"

          ls -lh "${ROM_ZIP}"

          echo "=== Testing ZIP ==="

          unzip -t "${ROM_ZIP}" >/dev/null

          echo "=== ZIP OK ==="

      # ============================================================
      # UPLOAD ROM
      # ============================================================
      - name: Upload ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-19.1-A31
          path: |
            lineage/out/target/product/a31/*.zip
            lineage/out/target/product/a31/*.img
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # UPLOAD LOGS
      # ============================================================
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A31-build-logs
          path: |
            lineage/out/soong.log
            lineage/out/verbose.log
            lineage/out/build_trace.txt
            lineage/out/error.log
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # FINAL REPORT
      # ============================================================
      - name: Build summary
        if: always()
        run: |
          echo "========================================"
          echo " Galaxy A31 - LineageOS 19.1"
          echo " Product: a31"
          echo "========================================"

          if [ -d "${GITHUB_WORKSPACE}/lineage" ]; then
            cd "${GITHUB_WORKSPACE}/lineage"

            echo ""
            echo "=== Disk ==="
            df -h

            echo ""
            echo "=== Ccache ==="
            ccache -s || true

            echo ""
            echo "=== Output ==="

            if [ -d out/target/product/a31 ]; then
              ls -lah out/target/product/a31 || true
            else
              echo "No A31 output directory."
            fi
          fi
