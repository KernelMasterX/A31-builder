name: 🚀 LineageOS 19.1 • Galaxy A31

on:
  workflow_dispatch:

jobs:
  build:
    name: 🛠️ A31 ROM Build
    runs-on: ubuntu-22.04

    env:
      USE_CCACHE: 1
      CCACHE_EXEC: /usr/bin/ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:

      # ============================================================
      # 🌱 START
      # ============================================================

      - name: 🌱 Start
        run: |
          echo "=========================================="
          echo "   Galaxy A31 • LineageOS 19.1"
          echo "=========================================="
          echo ""
          echo "Bugün ROM build ediyoruz. 😎"
          echo "Target: lineage_a31-userdebug"
          echo ""

      # ============================================================
      # 📦 CHECKOUT
      # ============================================================

      - name: 📦 Checkout builder
        uses: actions/checkout@v6

      # ============================================================
      # 🧹 CLEAN RUNNER
      # ============================================================

      - name: 🧹 Prepare runner
        run: |
          set -e

          echo "🧹 Gereksiz runner dosyaları temizleniyor..."

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache

          sudo apt-get clean

          echo ""
          echo "💾 Kullanılabilir alan:"
          df -h

          echo ""
          echo "✅ Runner hazır."

      # ============================================================
      # 🔧 DEPENDENCIES
      # ============================================================

      - name: 🔧 Install dependencies
        run: |
          set -e

          echo "🔧 Build bağımlılıkları kuruluyor..."

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libncurses6 \
            libssl-dev \
            libxml2-utils \
            lzop \
            openjdk-11-jdk \
            pngcrush \
            python3 \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

          echo ""
          echo "✅ Bağımlılıklar hazır."

      # ============================================================
      # 📚 REPO
      # ============================================================

      - name: 📚 Install repo
        run: |
          set -e

          echo "📚 Google repo aracı hazırlanıyor..."

          mkdir -p "${HOME}/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"

          chmod +x "${HOME}/bin/repo"

          echo "${HOME}/bin" >> "${GITHUB_PATH}"

          "${HOME}/bin/repo" --version

          echo ""
          echo "✅ repo hazır."

      # ============================================================
      # 🌳 LINEAGE INIT
      # ============================================================

      - name: 🌳 Initialize LineageOS 19.1
        run: |
          set -e

          echo "🌳 LineageOS 19.1 source hazırlanıyor..."

          repo init \
            -u https://github.com/LineageOS/android.git \
            -b lineage-19.1 \
            --depth=1 \
            --no-repo-verify

          echo ""
          echo "✅ LineageOS 19.1 hazır."

      # ============================================================
      # ⬇️ SOURCE SYNC
      # ============================================================

      - name: ⬇️ Sync Android source
        run: |
          set -e

          echo "⬇️ Android source indiriliyor..."
          echo "Bu bölüm uzun sürebilir."
          echo "Sabır = ROM. 😎"
          echo ""

          repo sync \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            --current-branch \
            --detach \
            -j1

          echo ""
          echo "=========================================="
          echo "✅ SOURCE SYNC TAMAMLANDI"
          echo "=========================================="

          df -h

      # ============================================================
      # 📱 A31 DEVICE TREE
      # ============================================================

      - name: 📱 Clone A31 device tree
        run: |
          set -e

          echo "📱 A31 device tree indiriliyor..."

          git clone \
            --depth=1 \
            --branch main \
            https://github.com/KernelMasterX/android_device_samsung_a31.git \
            device/samsung/a31

          echo "✅ Device tree hazır."

      # ============================================================
      # 🧠 KERNEL
      # ============================================================

      - name: 🧠 Clone A31 kernel
        run: |
          set -e

          echo "🧠 A31 kernel indiriliyor..."

          git clone \
            --depth=1 \
            --branch lineage-19.1 \
            https://github.com/KernelMasterX/android_kernel_samsung_a31.git \
            kernel/samsung/a31

          echo "✅ Kernel hazır."

      # ============================================================
      # 📦 VENDOR
      # ============================================================

      - name: 📦 Clone A31 vendor
        run: |
          set -e

          echo "📦 A31 vendor indiriliyor..."

          git clone \
            --depth=1 \
            --branch lineage-19.1 \
            https://github.com/KernelMasterX/android_vendor_samsung_a31.git \
            vendor/samsung/a31

          echo "✅ Vendor hazır."

      # ============================================================
      # 🔍 QUICK CHECK
      # ============================================================

      - name: 🔍 Check A31 source
        run: |
          set -e

          echo "🔍 A31 kaynakları kontrol ediliyor..."
          echo ""

          test -f device/samsung/a31/AndroidProducts.mk
          test -f device/samsung/a31/BoardConfig.mk
          test -f device/samsung/a31/device.mk
          test -f device/samsung/a31/lineage_a31.mk
          test -f kernel/samsung/a31/Makefile
          test -d vendor/samsung/a31

          echo "✅ AndroidProducts.mk"
          echo "✅ BoardConfig.mk"
          echo "✅ device.mk"
          echo "✅ lineage_a31.mk"
          echo "✅ Kernel"
          echo "✅ Vendor"

          echo ""
          echo "🎉 A31 kaynak ağacı sağlam görünüyor."

      # ============================================================
      # 🧪 PRODUCT CHECK
      # ============================================================

      - name: 🧪 Validate product
        run: |
          set -e

          echo "🧪 Product tanımı kontrol ediliyor..."
          echo ""

          echo "----- AndroidProducts.mk -----"
          cat device/samsung/a31/AndroidProducts.mk

          echo ""
          echo "----- lineage_a31.mk -----"
          cat device/samsung/a31/lineage_a31.mk

          echo ""
          echo "----- PRODUCT_NAME -----"

          grep -n \
            'PRODUCT_NAME[[:space:]]*:=[[:space:]]*lineage_a31' \
            device/samsung/a31/lineage_a31.mk

          echo ""
          echo "🎯 Product: lineage_a31"
          echo "📱 Device: a31"
          echo ""
          echo "✅ Product tanımı hazır."
          echo "➡️ Build aşamasına geçebiliriz."

      # ============================================================
      # ⚡ CCACHE
      # ============================================================

      - name: ⚡ Configure ccache
        run: |
          set -e

          echo "⚡ ccache hazırlanıyor..."

          mkdir -p "${CCACHE_DIR}"

          ccache --set-config=max_size=20G
          ccache --set-config=compression=true

          ccache -z

          echo ""
          echo "✅ ccache hazır."
          ccache -s

      # ============================================================
      # 🏗️ BUILD ENVIRONMENT
      # ============================================================

      - name: 🏗️ Prepare build environment
        run: |
          set -e

          echo "🏗️ Android build environment hazırlanıyor..."

          source build/envsetup.sh

          echo ""
          echo "🎯 Lunch: lineage_a31-userdebug"
          echo ""

          lunch lineage_a31-userdebug

          echo ""
          echo "=========================================="
          echo "✅ BUILD ENVIRONMENT HAZIR"
          echo "=========================================="

      # ============================================================
      # 🚀 BUILD
      # ============================================================

      - name: 🚀 Build ROM
        run: |
          set -o pipefail

          mkdir -p build_logs

          echo "=========================================="
          echo "🚀 A31 ROM BUILD BAŞLIYOR"
          echo "=========================================="
          echo ""

          echo "📱 Device : Galaxy A31"
          echo "🎯 Target : LineageOS 19.1"
          echo "🧩 Product: lineage_a31"
          echo ""

          echo "💾 Build öncesi disk:"
          df -h

          echo ""
          echo "🔥 mka bacon başlıyor..."
          echo ""

          source build/envsetup.sh
          lunch lineage_a31-userdebug

          mka bacon 2>&1 | tee build_logs/build.log

      # ============================================================
      # 🎉 SUCCESS
      # ============================================================

      - name: 🎉 Build success
        if: success()
        run: |
          echo ""
          echo "=========================================="
          echo "🎉🎉🎉 BUILD BAŞARILI 🎉🎉🎉"
          echo "=========================================="
          echo ""

          echo "ROM çıktıları:"
          echo ""

          find out/target/product/a31 \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*.zip" \
              -o -name "*.img" \
              -o -name "*.img.xz" \
            \) \
            -print

          echo ""
          echo "💾 Son disk durumu:"
          df -h

          echo ""
          echo "⚡ ccache:"
          ccache -s

          echo ""
          echo "ANDROID ROM YAPILDI. 🔥"

      # ============================================================
      # 📤 ROM ARTIFACT
      # ============================================================

      - name: 📤 Upload ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-19.1-A31
          path: |
            out/target/product/a31/*.zip
            out/target/product/a31/*.img
            out/target/product/a31/*.img.xz
          if-no-files-found: error
          compression-level: 0

      # ============================================================
      # 🧾 FAILURE LOG
      # ============================================================

      - name: 🧾 Save failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A31-Build-Logs
          path: |
            build_logs/
            out/soong.log
            out/error.log
          if-no-files-found: warn

      # ============================================================
      # 💾 FINAL STATUS
      # ============================================================

      - name: 💾 Final status
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "📊 FINAL STATUS"
          echo "=========================================="

          echo ""
          echo "Disk:"
          df -h

          echo ""
          echo "ccache:"
          ccache -s || true

          echo ""
          echo "Build workspace:"
          du -sh out 2>/dev/null || true

          echo ""
          echo "🏁 Workflow tamamlandı."
