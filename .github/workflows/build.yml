name: Build LineageOS 19.1 - Galaxy A31

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free disk space
        shell: bash
        run: |
          set -eux

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache

          sudo apt-get clean

          echo "=== DISK AFTER CLEANUP ==="
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libncurses6 \
            libssl-dev \
            libxml2-utils \
            lzop \
            openjdk-11-jdk \
            pngcrush \
            python3 \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

          echo "=== DISK AFTER DEPENDENCIES ==="
          df -h

      - name: Install repo tool
        shell: bash
        run: |
          set -eux

          mkdir -p "${HOME}/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"

          chmod +x "${HOME}/bin/repo"

          echo "${HOME}/bin" >> "${GITHUB_PATH}"

          "${HOME}/bin/repo" --version

      - name: Initialize LineageOS 19.1 source
        shell: bash
        run: |
          set -eux

          mkdir -p "${GITHUB_WORKSPACE}/lineage"
          cd "${GITHUB_WORKSPACE}/lineage"

          repo init \
            -u https://github.com/LineageOS/android.git \
            -b lineage-19.1 \
            --depth=1 \
            --no-repo-verify

      - name: Sync LineageOS source
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/lineage"

          repo sync \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            --current-branch \
            --detach \
            -j1

          echo "=== DISK AFTER SYNC ==="
          df -h

      - name: Clone A31 device tree
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/lineage"

          rm -rf device/samsung/a31

          git clone \
            --depth=1 \
            --branch main \
            https://github.com/KernelMasterX/android_device_samsung_a31.git \
            device/samsung/a31

          echo "=== DISK AFTER DEVICE TREE ==="
          df -h

      - name: Clone A31 kernel
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/lineage"

          rm -rf kernel/samsung/a31

          git clone \
            --depth=1 \
            --branch lineage-19.1 \
            https://github.com/KernelMasterX/android_kernel_samsung_a31.git \
            kernel/samsung/a31

          echo "=== DISK AFTER KERNEL ==="
          df -h

      - name: Clone A31 vendor
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/lineage"

          rm -rf vendor/samsung/a31

          git clone \
            --depth=1 \
            --branch lineage-19.1 \
            https://github.com/KernelMasterX/android_vendor_samsung_a31.git \
            vendor/samsung/a31

          echo "=== DISK AFTER VENDOR ==="
          df -h

      - name: Verify A31 sources
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/lineage"

          echo "=== DEVICE TREE ==="

          test -f device/samsung/a31/AndroidProducts.mk
          test -f device/samsung/a31/BoardConfig.mk
          test -f device/samsung/a31/device.mk
          test -f device/samsung/a31/a31.mk

          echo "=== KERNEL ==="

          test -f kernel/samsung/a31/Makefile

          echo "=== VENDOR ==="

          test -d vendor/samsung/a31

          echo "=== DEVICE TREE FILES ==="
          ls -la device/samsung/a31

          echo "=== KERNEL FILES ==="
          ls -la kernel/samsung/a31 | head -50

          echo "=== VENDOR FILES ==="
          ls -la vendor/samsung/a31

      - name: Configure ccache
        shell: bash
        run: |
          set -eux

          ccache -M 20G
          ccache -z

          echo "USE_CCACHE=1" >> "${GITHUB_ENV}"
          echo "CCACHE_EXEC=/usr/bin/ccache" >> "${GITHUB_ENV}"

          ccache -s

      - name: Prepare build environment
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/lineage"

          source build/envsetup.sh

          lunch lineage_a31-userdebug

          echo "=== BUILD VARIABLES ==="

          get_build_var TARGET_PRODUCT
          get_build_var TARGET_BUILD_VARIANT
          get_build_var TARGET_ARCH

      - name: Disk check before build
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/lineage"

          echo "=== DISK BEFORE BUILD ==="
          df -h

          echo "=== CCACHE ==="
          ccache -s

      - name: Build LineageOS 19.1
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/lineage"

          source build/envsetup.sh
          lunch lineage_a31-userdebug

          mka bacon

      - name: Disk check after build
        if: always()
        shell: bash
        run: |
          set +e

          cd "${GITHUB_WORKSPACE}/lineage"

          echo "=== DISK AFTER BUILD ==="
          df -h

          echo "=== CCACHE ==="
          ccache -s || true

          echo "=== PRODUCT OUTPUT ==="
          ls -lah out/target/product/a31/ || true

      - name: Upload ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-19.1-A31
          path: |
            lineage/out/target/product/a31/*.zip
            lineage/out/target/product/a31/*.img
            lineage/out/target/product/a31/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A31-build-logs
          path: |
            lineage/out/soong.log
            lineage/out/verbose.log
            lineage/out/build_trace.txt
          if-no-files-found: warn
          retention-days: 7
