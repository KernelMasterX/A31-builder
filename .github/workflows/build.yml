name: Galaxy A31 - LineageOS 19.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ROM_DIR: ${{ github.workspace }}/rom
      CCACHE_DIR: ${{ github.workspace }}/ccache
      RELEASE_DIR: ${{ github.workspace }}/release

    steps:
      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo apt-get clean
          sudo docker system prune -af || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs \
            gnupg gperf imagemagick lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool \
            libncurses-dev libssl-dev libxml2 \
            libxml2-utils lzop openjdk-11-jdk \
            pngcrush rsync schedtool squashfs-tools \
            unzip zip zlib1g-dev python-is-python3 python3
          df -h

      - name: Install latest repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" version
          df -h

      - name: Initialize LineageOS
        run: |
          mkdir -p "$ROM_DIR"
          cd "$ROM_DIR"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          repo init \
            -u https://github.com/LineageOS/android.git \
            -b lineage-19.1 \
            --git-lfs \
            --depth=1
          df -h

      - name: Sync LineageOS source
        run: |
          cd "$ROM_DIR"
          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2
          echo "=== Disk after sync ==="
          df -h
          free -h

      - name: Clone Galaxy A31 device tree
        run: |
          cd "$ROM_DIR"
          git clone \
            -b lineage-19.1 \
            --depth=1 \
            https://github.com/KernelMasterX/android_device_samsung_a31.git \
            device/samsung/a31
          df -h

      - name: Clone Galaxy A31 kernel
        run: |
          cd "$ROM_DIR"
          git clone \
            -b lineage-19.1 \
            --depth=1 \
            https://github.com/KernelMasterX/android_kernel_samsung_a31.git \
            kernel/samsung/a31
          df -h

      - name: Clone Galaxy A31 vendor
        run: |
          cd "$ROM_DIR"
          git clone \
            -b lineage-19.1 \
            --depth=1 \
            https://github.com/KernelMasterX/android_vendor_samsung_a31.git \
            vendor/samsung/a31
          df -h

      - name: Configure ccache
        run: |
          mkdir -p "$CCACHE_DIR" "$RELEASE_DIR"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          ccache -M 20G
          df -h

      - name: Build LineageOS
        run: |
          cd "$ROM_DIR"
          source build/envsetup.sh
          lunch lineage_a31-userdebug
          mka bacon -j2
          df -h

      - name: Collect ROM ZIP
        if: success()
        run: |
          mkdir -p "$RELEASE_DIR"
          find "$ROM_DIR/out/target/product/a31" \
            -maxdepth 1 -type f -name '*.zip' \
            -exec cp -v {} "$RELEASE_DIR/" \;
          test -n "$(find "$RELEASE_DIR" -maxdepth 1 -name '*.zip' -print -quit)"
          df -h

      - name: Upload ROM artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-A31-LineageOS-19.1
          path: release/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: a31-lineage-19.1-${{ github.run_number }}
          name: Galaxy A31 LineageOS 19.1 Build ${{ github.run_number }}
          body: |
            Unofficial LineageOS 19.1 build for Samsung Galaxy A31 (SM-A315F).

            Device: a31
            Android version: 12L
            Build number: ${{ github.run_number }}

            Experimental build. Flash at your own risk.
          files: release/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: false

      - name: Disk status on failure
        if: failure()
        run: |
          df -h
          free -h
          du -sh "$ROM_DIR/.repo" "$ROM_DIR/out" 2>/dev/null || true
